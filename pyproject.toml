[project]
name = "devsecops-demo-api"
version = "1.0.0"
description = "API de demostración para integración de gestión de vulnerabilidades en CI/CD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
    # ⚠️ NOTA: Las vulnerabilidades serán detectadas por:
    # 1. Código vulnerable (SQL Injection, deserialización) → SAST (Bandit/CodeQL)
    # 2. Dependencias transitivas → pip-audit, Safety
    # 3. Imagen Docker → Trivy (vulnerabilidades del SO)
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "S"]
ignore = ["S101"]  # Permitir assert en tests
