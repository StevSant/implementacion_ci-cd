# Workflow 4: Build y Container Scan
name: 🐳 Build & Container Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: devsecops-demo-api

jobs:
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_built: ${{ steps.build.outcome == 'success' }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build imagen Docker
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 💾 Guardar imagen
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} -o docker-image.tar

      - name: 📦 Subir imagen como artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 1

  trivy-scan:
    name: 🔍 Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📥 Descargar imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: 🐳 Cargar imagen Docker
        run: docker load -i docker-image.tar

      - name: 🔍 Escanear con Trivy (tabla)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          output: 'trivy-report.txt'

      - name: 📊 Generar reporte JSON
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'json'
          output: 'trivy-report.json'

      - name: 📋 Mostrar resultados
        run: |
          echo "## 🐳 Trivy Container Scan Results" >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY

      - name: 📊 Subir reportes Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-report.txt
            trivy-report.json

      - name: ❌ Fallar si hay vulnerabilidades CRITICAL
        run: |
          CRITICAL_COUNT=$(cat trivy-report.json | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
          echo "Vulnerabilidades CRITICAL: $CRITICAL_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::❌ Se encontraron $CRITICAL_COUNT vulnerabilidades CRITICAL"
            echo "## ❌ CRITICAL vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ No CRITICAL vulnerabilities found" >> $GITHUB_STEP_SUMMARY
