# Workflow 3: Tests
name: 🧪 Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Instalar dependencias
        run: |
          pip install uv
          uv pip install --system -r pyproject.toml || pip install fastapi uvicorn pydantic pydantic-settings requests==2.25.1 pyyaml==5.4 jinja2==2.11.3
          pip install pytest pytest-cov httpx

      - name: 🧪 Ejecutar tests
        run: |
          echo "## 🧪 Resultados de Tests" >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=test-results.xml || echo "⚠️ Algunos tests fallaron"

      - name: 📊 Subir resultados de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            htmlcov/

      - name: 📈 Publicar resultados de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
